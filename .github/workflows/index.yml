# Rebuilds index.json (the list the Emulon X Hub reads) whenever skins change.
name: Update the skin list
on:
  push:
    branches: [ main ]
    paths: [ "skins/**", "tools/build_index.py" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/build_index.py
      - name: Commit the list
        run: |
          if git diff --quiet index.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Update the skin list"
          git push
